version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kenza_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kenza_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenza_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kenza_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: kenza_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
